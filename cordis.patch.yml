# Mounts this bundle's Host plugin. The plugin owns the Wolfram kernel path as
# its own configuration (edited from the Plugins UI) and creates the official
# @deepseek-ai/dsh-mcp-client bridge on the root Loader at runtime, only while a
# path is configured. No kernel path is declared here.
- insert:
    - id: wolfram-mcp
      name: 'dsh-wolfram-mcp'
      config: {}
